<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout &mdash; Readora</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="container" style="padding-top:32px;padding-bottom:60px">
  <div class="section-header"><h2>Checkout</h2></div>

  <div class="cart-layout">
    <div>
      <h3 style="font-size:16px">Shipping Address</h3>
      <div class="form-group">
        <label for="address-select">Choose a saved address</label>
        <select id="address-select" class="form-control">
          <option value="">+ Add a new address</option>
        </select>
      </div>

      <div id="new-address-fields">
        <div class="form-row">
          <div class="form-group">
            <label for="line1">Address line 1</label>
            <input type="text" id="line1" class="form-control" placeholder="No, Street">
          </div>
          <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" class="form-control" placeholder="Moratuwa">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="district">District</label>
            <input type="text" id="district" class="form-control" placeholder="Colombo">
          </div>
          <div class="form-group">
            <label for="postalCode">Postal code</label>
            <input type="text" id="postalCode" class="form-control" placeholder="10400">
          </div>
        </div>
      </div>

      <h3 style="font-size:16px;margin-top:26px">Payment Method</h3>
      <div id="payment-methods" style="display:grid;gap:10px">
        <label class="form-control" style="display:flex;align-items:center;gap:10px;cursor:pointer">
          <input type="radio" name="paymentMethod" value="COD" checked> Cash on Delivery
        </label>
        <label class="form-control" style="display:flex;align-items:center;gap:10px;cursor:pointer">
          <input type="radio" name="paymentMethod" value="BANK_DEPOSIT"> Bank Deposit
        </label>
        <label class="form-control" style="display:flex;align-items:center;gap:10px;cursor:pointer">
          <input type="radio" name="paymentMethod" value="CREDIT_CARD"> Credit / Debit Card
        </label>
        <label class="form-control" style="display:flex;align-items:center;gap:10px;cursor:pointer">
          <input type="radio" name="paymentMethod" value="EZ_CASH"> eZ Cash
        </label>
        <label class="form-control" style="display:flex;align-items:center;gap:10px;cursor:pointer">
          <input type="radio" name="paymentMethod" value="FRIMI"> FriMi
        </label>
      </div>
    </div>

    <div class="summary-card">
      <div id="order-items-summary" style="margin-bottom:14px"></div>
      <div class="summary-row"><span>Subtotal</span><span id="sum-subtotal">Rs. 0.00</span></div>
      <div class="summary-row"><span>Shipping</span><span id="sum-shipping">Rs. 350.00</span></div>
      <div class="summary-row total"><span>Total</span><span id="sum-total">Rs. 0.00</span></div>
      <button class="btn btn-primary btn-block" style="margin-top:16px" id="place-order-btn">Place Order</button>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/chatbot.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
