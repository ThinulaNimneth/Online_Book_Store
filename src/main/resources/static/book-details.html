<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Book Details &mdash; Readora</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="container" style="padding-top:32px">
  <div class="details-meta" id="breadcrumb">
    <a href="index.html">Home</a> &rsaquo; <span id="breadcrumb-category">Category</span> &rsaquo; <span id="breadcrumb-title">&hellip;</span>
  </div>

  <div class="details-grid">
    <div>
      <div class="gallery-main" id="gallery-main">Loading&hellip;</div>
      <div class="gallery-thumbs" id="gallery-thumbs"></div>
    </div>

    <div>
      <span class="book-category" id="book-category">CATEGORY</span>
      <h1 id="book-title" style="margin-top:6px">&hellip;</h1>
      <div class="rating" id="book-rating"></div>

      <div class="details-meta">
        by <a href="#" id="book-author">&hellip;</a> &middot; Published by <span id="book-publisher">&hellip;</span>
      </div>

      <div class="price-row" style="margin:18px 0">
        <span class="price-special" id="book-price-special" style="font-size:26px">&hellip;</span>
        <span class="price-original" id="book-price-original"></span>
      </div>

      <span class="badge badge-success" id="stock-badge">In Stock</span>

      <p class="details-desc" id="book-description">&hellip;</p>

      <div class="qty-row">
        <div class="stepper">
          <button type="button" id="qty-minus">&minus;</button>
          <span id="qty-value">1</span>
          <button type="button" id="qty-plus">+</button>
        </div>
        <button class="btn btn-primary" id="add-to-cart-btn">Add to Cart</button>
        <button class="btn btn-outline" id="wishlist-btn">
          <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M12 20s-7-4.35-9.5-8.5C.7 8.1 2.4 4.5 6 4.5c2 0 3.4 1.1 4 2.2.6-1.1 2-2.2 4-2.2 3.6 0 5.3 3.6 3.5 7C19 15.65 12 20 12 20z" stroke="currentColor" stroke-width="1.8"/></svg>
          Save
        </button>
      </div>
    </div>
  </div>

  <section class="section" style="border-top:1px solid var(--border-soft)">
    <div class="section-header">
      <h2>Reviews</h2>
    </div>

    <div id="review-form-wrap" style="max-width:520px;margin-bottom:28px">
      <div class="form-group">
        <label for="review-rating">Your rating</label>
        <select id="review-rating" class="form-control">
          <option value="5">&#9733;&#9733;&#9733;&#9733;&#9733; &mdash; Excellent</option>
          <option value="4">&#9733;&#9733;&#9733;&#9733;&#9734; &mdash; Good</option>
          <option value="3">&#9733;&#9733;&#9733;&#9734;&#9734; &mdash; Okay</option>
          <option value="2">&#9733;&#9733;&#9734;&#9734;&#9734; &mdash; Not great</option>
          <option value="1">&#9733;&#9734;&#9734;&#9734;&#9734; &mdash; Poor</option>
        </select>
      </div>
      <div class="form-group">
        <label for="review-comment">Comment</label>
        <textarea id="review-comment" class="form-control" rows="3" placeholder="What did you think of this book?"></textarea>
      </div>
      <button class="btn btn-primary btn-sm" id="review-submit">Post Review</button>
    </div>

    <div id="review-list"></div>
    <div class="empty-state" id="review-empty" style="display:none">
      <h3>No reviews yet</h3>
      <p>Be the first to review this book.</p>
    </div>
  </section>
</div>

<div id="footer-placeholder"></div>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/chatbot.js"></script>
<script src="js/book-details.js"></script>
</body>
</html>
