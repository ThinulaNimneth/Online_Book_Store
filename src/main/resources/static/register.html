<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account &mdash; Potha</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="auth-shell">
  <div class="auth-card" style="max-width:420px">
    <h1 style="text-align:center;font-size:22px">Create Account</h1>

    <div class="social-login-row">
      <button type="button" class="btn-social btn-facebook" id="facebook-signup-btn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M15 8.5h2V5.5h-2c-2 0-3.5 1.5-3.5 3.5v2H9v3h2.5V21h3v-7h2.3l.7-3h-3v-1.5c0-.5.3-1 1-1z"/></svg>
        Facebook
      </button>
      <button type="button" class="btn-social btn-google" id="google-signup-btn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.5h3.3c1.9-1.8 3-4.4 3-7.4z"/><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.3-2.5c-.9.6-2 1-3.3 1-2.5 0-4.7-1.7-5.4-4H3.2v2.6A10 10 0 0 0 12 22z"/><path d="M6.6 14.1a6 6 0 0 1 0-3.8V7.7H3.2a10 10 0 0 0 0 8.9l3.4-2.5z"/><path d="M12 6.6c1.5 0 2.8.5 3.8 1.5l2.8-2.8C16.9 3.6 14.6 2.6 12 2.6a10 10 0 0 0-8.8 5.1l3.4 2.6c.7-2.3 2.9-4 5.4-4z"/></svg>
        Google
      </button>
    </div>
    <div class="auth-divider">Or Register With Email</div>

    <div class="alert alert-danger" id="register-error"></div>

    <form id="register-form">
      <div class="form-group">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" class="form-control" placeholder="Nimal Perera" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" class="form-control" placeholder="07X XXX XXXX">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="At least 8 characters" required minlength="8">
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="register-submit">Create Account</button>
    </form>

    <p class="form-foot">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/chatbot.js"></script>
<script src="js/register.js"></script>
</body>
</html>
