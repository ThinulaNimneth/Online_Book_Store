<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart &mdash; Potha</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="container" style="padding-top:32px;padding-bottom:60px">
  <div class="section-header">
    <h2>Your Cart</h2>
  </div>

  <div class="cart-layout" id="cart-layout">
    <div>
      <div id="cart-items"></div>
      <div class="empty-state" id="cart-empty" style="display:none">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L20 8H6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h3>Your cart is empty</h3>
        <p>Browse the catalog and add a few books to get started.</p>
        <a href="index.html" class="btn btn-primary btn-sm">Browse Books</a>
      </div>
    </div>

    <div class="summary-card">
      <div class="summary-row"><span>Subtotal</span><span id="sum-subtotal">Rs. 0.00</span></div>
      <div class="summary-row"><span>Shipping</span><span id="sum-shipping">Rs. 350.00</span></div>
      <div class="summary-row total"><span>Total</span><span id="sum-total">Rs. 0.00</span></div>
      <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:16px" id="checkout-btn">Proceed to Checkout</a>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/chatbot.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
